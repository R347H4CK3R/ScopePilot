name: Verify and build mobile apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 scripts/sync_assets.py && git diff --exit-code
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8137 --bind 127.0.0.1 --directory web &
          sleep 2
          node tests/ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ScopePilot-UI-evidence
          path: /tmp/scopepilot-*.png
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug lint
      # Same-repository builds use Releases storage, not the Actions artifact allowance.
      # Fork and Dependabot events keep the original artifact path.
      - name: Preserve verified output in a private draft release
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_FILE: android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_PREFIX: scopepilot-android
        run: |
          set -euo pipefail
          test -s "$OUTPUT_FILE"
          TAG="${RELEASE_PREFIX}-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sha256sum "$OUTPUT_FILE" > "$OUTPUT_FILE.sha256"
          gh release create "$TAG" "$OUTPUT_FILE" "$OUTPUT_FILE.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "$RELEASE_PREFIX CI output $GITHUB_RUN_ID" --notes "CI output from commit $GITHUB_SHA, run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT. Private draft evidence only; not a signed, device-verified or store-approved release."
          VERIFY_DIR=$(mktemp -d "$RUNNER_TEMP/release-check.XXXXXX")
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$OUTPUT_FILE")" --dir "$VERIFY_DIR"
          cmp "$OUTPUT_FILE" "$VERIFY_DIR/$(basename "$OUTPUT_FILE")"
          cat "$OUTPUT_FILE.sha256"
      - uses: actions/upload-artifact@v4
        if: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) }}
        with:
          name: ScopePilot-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    permissions:
      contents: write
    runs-on: macos-15
    needs: web
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: python3 scripts/make_icon.py
      - run: cd ios && xcodegen generate
      - run: xcodebuild -project ios/ScopePilot.xcodeproj -scheme ScopePilot -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/ScopePilot.app package/Payload/
          cd package && zip -qr ../ScopePilot-unsigned.ipa Payload
      - name: Verify unsigned iPhone package
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os, plistlib, zipfile
          from pathlib import Path
          ipa = Path('ScopePilot-unsigned.ipa')
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None
              root = 'Payload/ScopePilot.app/'
              info = plistlib.loads(archive.read(root + 'Info.plist'))
              assert info['CFBundleIdentifier'] == 'app.scopepilot.mobile'
              assert info['CFBundleShortVersionString'] == '0.3.0'
              assert info['CFBundleVersion'] == '3'
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
              assert float(info['MinimumOSVersion']) >= 16.0
              executable = archive.read(root + info['CFBundleExecutable'])
              assert executable[:4] in [b'\xcf\xfa\xed\xfe', b'\xca\xfe\xba\xbe', b'\xbe\xba\xfe\xca']
              for name in ['index.html', 'style.css', 'bundle.js']:
                  assert archive.read(root + 'Web/' + name) == Path('web', name).read_bytes()
          manifest = {'commit': os.environ['GITHUB_SHA'], 'ipa': ipa.name, 'sha256': hashlib.sha256(ipa.read_bytes()).hexdigest(), 'bytes': ipa.stat().st_size, 'bundleIdentifier': info['CFBundleIdentifier'], 'version': info['CFBundleShortVersionString'], 'build': info['CFBundleVersion'], 'minimumOSVersion': info['MinimumOSVersion'], 'signing': 'unsigned; requires compatible signing or container', 'checks': ['ZIP integrity', 'device platform', 'bundle identity', 'Mach-O executable', 'bundled source byte equality']}
          Path('ScopePilot-build-manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PYVERIFY
          file build/Build/Products/Release-iphoneos/ScopePilot.app/ScopePilot
      - name: Save iPhone files in a private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="scopepilot-ios-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" ScopePilot-unsigned.ipa ScopePilot-build-manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "ScopePilot iOS 0.3.0 candidate ${GITHUB_RUN_ID}" --notes "Unsigned iPhone build from commit $GITHUB_SHA. Private draft for verification and compatible signing/container use. Not an App Store release or a physical-device validation claim."
  ios-simulator:
    runs-on: macos-15
    needs: web
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: python3 scripts/make_icon.py
      - run: cd ios && xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > simulator-devices.json
          python3 - <<'PY'
          import json, os
          devices = json.load(open('simulator-devices.json'))['devices']
          candidates = [d for runtime, group in devices.items() if '.iOS-' in runtime for d in group if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator is installed on this runner.')
          chosen = candidates[0]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + chosen['udid'] + '\n')
          print('Selected:', chosen['name'], chosen['udid'])
          PY
      - name: Verify native iPhone launch and bundled navigation
        run: xcodebuild test -project ios/ScopePilot.xcodeproj -scheme ScopePilot -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath simulator-results CODE_SIGNING_ALLOWED=NO

