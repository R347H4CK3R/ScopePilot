name: Verify and build mobile apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 scripts/sync_assets.py && git diff --exit-code
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8137 --bind 127.0.0.1 --directory web &
          sleep 2
          node tests/ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ScopePilot-UI-evidence
          path: /tmp/scopepilot-*.png
  android:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug lint
      - uses: actions/upload-artifact@v4
        with:
          name: ScopePilot-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    needs: web
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: python3 scripts/make_icon.py
      - run: cd ios && xcodegen generate
      - run: xcodebuild -project ios/ScopePilot.xcodeproj -scheme ScopePilot -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/ScopePilot.app package/Payload/
          cd package && zip -qr ../ScopePilot-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ScopePilot-iOS-unsigned
          path: ScopePilot-unsigned.ipa
